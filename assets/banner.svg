<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Header Gradient Accent -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Badge/Pill Fill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Center Orbs -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.2); opacity: 0.45; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes beamDash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes tagShimmer {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .pulse-orb-1 {
      transform-origin: 220px 100px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulse-orb-2 {
      transform-origin: 980px 260px;
      animation: pulseGlow 8s ease-in-out infinite 1s;
    }
    .pulse-orb-3 {
      transform-origin: 600px 190px;
      animation: pulseGlow 10s ease-in-out infinite 2s;
    }

    .float-card-1 { animation: float1 5s ease-in-out infinite; }
    .float-card-2 { animation: float2 6s ease-in-out infinite 0.5s; }
    .float-card-3 { animation: float3 5.5s ease-in-out infinite 1s; }
    .float-card-4 { animation: float1 6.5s ease-in-out infinite 1.5s; }

    .beam-flow {
      stroke-dasharray: 12, 16;
      animation: beamDash 20s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs -->
  <circle class="pulse-orb-1" cx="220" cy="100" r="180" fill="url(#glowCyan)" />
  <circle class="pulse-orb-2" cx="980" cy="260" r="220" fill="url(#glowPurple)" />
  <circle class="pulse-orb-3" cx="600" cy="190" r="260" fill="url(#glowRose)" />

  <!-- Architectural Background Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="160" y1="0" x2="160" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
  </g>

  <!-- Animated Data Connection Lines -->
  <path class="beam-flow" d="M 80 180 Q 320 60, 600 180 T 1120 180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="beam-flow" d="M 120 280 Q 400 350, 700 240 T 1100 100" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Animated Decorative Pills (Arranged on sides, keeping center foreground clear) -->
  <g class="float-card-1" filter="url(#softShadow)">
    <rect x="50" y="55" width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="70" cy="74" r="5" fill="#38bdf8" />
    <text x="85" y="79" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Headless &amp; Decoupled</text>
  </g>

  <g class="float-card-2" filter="url(#softShadow)">
    <rect x="60" y="275" width="190" height="38" rx="19" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="80" cy="294" r="5" fill="#a855f7" />
    <text x="95" y="299" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Composable DXP</text>
  </g>

  <g class="float-card-3" filter="url(#softShadow)">
    <rect x="960" y="65" width="185" height="38" rx="19" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="980" cy="84" r="5" fill="#34d399" />
    <text x="995" y="89" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🚀 Open-Source Engines</text>
  </g>

  <g class="float-card-4" filter="url(#softShadow)">
    <rect x="950" y="270" width="195" height="38" rx="19" fill="url(#pillGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="970" cy="289" r="5" fill="#f43f5e" />
    <text x="985" y="294" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🏢 Enterprise Omnichannel</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed never obscured) -->
  <g id="heroForeground">
    <!-- Top Category Pill -->
    <g filter="url(#softShadow)">
      <rect x="475" y="42" width="250" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#titleGrad)" stroke-width="1.2" />
      <circle cx="493" cy="58" r="4" fill="#38bdf8" />
      <text x="507" y="63" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ENTERPRISE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      AWESOME ENTERPRISE CMS
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" opacity="0.95">
      Enterprise Content Management Systems &amp; Digital Experience Platforms
    </text>

    <!-- Descriptive Text -->
    <text x="600" y="218" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      Decoupled Architectures • Headless APIs • SaaS Clouds • Open-Source Alternatives
    </text>

    <!-- Bottom Feature Bar -->
    <g transform="translate(300, 252)">
      <rect width="600" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="300" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
        ✨ 15+ Enterprise SaaS Platforms &#160;•&#160; 🌟 25+ Open-Source Repositories &#160;•&#160; 📊 Market Dynamics
      </text>
    </g>
  </g>
</svg>
